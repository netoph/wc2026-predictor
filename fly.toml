app = "wc2026-predictor"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8026"

[http_service]
  internal_port = 8026
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
